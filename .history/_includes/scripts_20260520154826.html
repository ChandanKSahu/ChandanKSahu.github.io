<script src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
// Fix: main.min.js contains old greedy-nav code that moves <li> elements from
// .visible-links into .hidden-links at load time and on resize. Since main.min.js
// has already executed synchronously above, we immediately undo the damage and
// replace the global updateNav function with a no-op.
(function() {
  var $vlinks = $('#site-nav .visible-links');
  var $hlinks = $('#site-nav .hidden-links');
  var $btn    = $('#greedy-nav-btn');

  function restoreNav() {
    if ($hlinks.length && $vlinks.length) {
      $hlinks.children().appendTo($vlinks);
    }
    if ($btn.length) { $btn.addClass('hidden').hide(); }
    if ($hlinks.length) { $hlinks.addClass('hidden').hide(); }
  }

  // 1. Immediately undo what updateNav() just did during main.min.js execution
  restoreNav();

  // 2. Replace the global updateNav so resize events become harmless
  if (typeof updateNav === 'function') {
    updateNav = function() {};
  }

  // 3. Safety net for any deferred execution paths
  $(document).ready(restoreNav);
})();
</script>
