{% include base_path %}
<script src="{{ base_path }}/assets/js/main.min.js" defer></script>

<script>
// Fix: main.min.js contains old greedy-nav code that moves <li> elements from
// .visible-links into .hidden-links at load time and on resize. Since main.min.js
// is deferred, we wait for DOMContentLoaded (which fires after deferred scripts)
// then undo the damage and replace the global updateNav function with a no-op.
document.addEventListener('DOMContentLoaded', function() {
  var $ = window.jQuery;
  if (!$) return;

  var $vlinks = $('#site-nav .visible-links');
  var $hlinks = $('#site-nav .hidden-links');
  var $btn    = $('#greedy-nav-btn');

  function restoreNav() {
    if ($hlinks.length && $vlinks.length) {
      $hlinks.children().appendTo($vlinks);
    }
    if ($btn.length) { $btn.addClass('hidden').hide(); }
    if ($hlinks.length) { $hlinks.addClass('hidden').hide(); }
  }

  restoreNav();

  if (typeof window.updateNav === 'function') {
    window.updateNav = function() {};
  }
});
</script>
