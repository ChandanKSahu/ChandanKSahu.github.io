{% include base_path %}
<script src="{{ base_path }}/assets/js/main.min.js" defer></script>

<script>
// Fix: main.min.js (deferred) bundles old greedy-nav code that moves <li>
// elements from .visible-links into .hidden-links inside $(document).ready().
// A plain DOMContentLoaded handler registered before the deferred script fires
// BEFORE jQuery's ready callbacks, so it cannot undo changes that haven't
// happened yet.  Using setTimeout(fn, 0) inside DOMContentLoaded defers the
// restore to the next macrotask — after all synchronous ready handlers finish.
// A MutationObserver guards against resize-triggered re-collapses.
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    var $ = window.jQuery;
    if (!$) return;

    var $nav    = $('#site-nav');
    var $vlinks = $nav.find('.visible-links');
    var $hlinks = $nav.find('.hidden-links');
    var $btn    = $('#greedy-nav-btn');

    function restoreAllLinks() {
      if ($hlinks.length && $vlinks.length) {
        $hlinks.children().appendTo($vlinks);
      }
      $btn.addClass('hidden').hide();
      $hlinks.addClass('hidden').hide();
    }

    restoreAllLinks();

    // Neutralise the greedy-nav global so future calls are harmless
    if (typeof window.updateNav === 'function') {
      window.updateNav = function() {};
    }

    // Guard against resize-triggered re-collapse by the bundled greedy-nav
    if (window.MutationObserver && $hlinks.length) {
      new MutationObserver(function() {
        if ($hlinks.children().length > 0) {
          restoreAllLinks();
        }
      }).observe($hlinks[0], { childList: true });
    }
  }, 0);
});
</script>
