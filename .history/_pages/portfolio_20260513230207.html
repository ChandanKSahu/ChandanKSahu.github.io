<script>
/* ── Honda carousel ── */
(function () {
  var carousel = document.querySelector('[data-honda-carousel]');
  if (!carousel) return;

  var models = Array.prototype.slice.call(carousel.querySelectorAll('.honda-model'));
  var thumbs = Array.prototype.slice.call(carousel.querySelectorAll('[data-model-index]'));
  var active = models.findIndex(function (model) {
    return model.getAttribute('data-position') === '0';
  });

  /* Create sliding highlight box */
  var thumbsContainer = carousel.querySelector('.honda-thumbs');
  var highlight = document.createElement('div');
  highlight.className = 'thumb-highlight';
  thumbsContainer.appendChild(highlight);

  function moveHighlight() {
    var target = thumbs[active];
    if (!target) return;
    highlight.style.width = target.offsetWidth + 'px';
    highlight.style.height = target.offsetHeight + 'px';
    highlight.style.transform = 'translate(' + target.offsetLeft + 'px, ' + target.offsetTop + 'px)';
  }

  function render() {
    models.forEach(function (model, index) {
      model.setAttribute('data-position', index === active ? '0' : 'hidden');
    });
    thumbs.forEach(function (thumb, index) {
      thumb.classList.toggle('is-active', index === active);
    });
    moveHighlight();
  }

  carousel.addEventListener('click', function (event) {
    var button = event.target.closest('[data-direction]');
    var thumb = event.target.closest('[data-model-index]');
    if (button) {
      active = (active + Number(button.getAttribute('data-direction')) + models.length) % models.length;
    } else if (thumb) {
      active = Number(thumb.getAttribute('data-model-index'));
    } else {
      return;
    }
    render();
  });

  /* Position highlight on load (no transition for initial placement) */
  highlight.style.transition = 'none';
  moveHighlight();
  /* Force reflow, then restore transition */
  highlight.offsetHeight;
  highlight.style.transition = '';
  window.addEventListener('resize', moveHighlight);
})();

/* ── ABB topic carousel (auto-cycling) ── */
(function () {
  var wrapper = document.querySelector('[data-abb-carousel]');
  if (!wrapper) return;

  var slides = Array.prototype.slice.call(wrapper.querySelectorAll('.abb-slide'));
  var thumbs = Array.prototype.slice.call(wrapper.querySelectorAll('[data-abb-thumb]'));
  var count  = slides.length;
  var active = 1;                       /* Agentic AI is the default (index 1) */

  /* Create sliding highlight box */
  var thumbsContainer = wrapper.querySelector('.abb-thumbs');
  var highlight = document.createElement('div');
  highlight.className = 'thumb-highlight thumb-highlight--abb';
  thumbsContainer.appendChild(highlight);

  function moveHighlight() {
    var target = thumbs[active];
    if (!target) return;
    highlight.style.width = target.offsetWidth + 'px';
    highlight.style.height = target.offsetHeight + 'px';
    highlight.style.transform = 'translate(' + target.offsetLeft + 'px, ' + target.offsetTop + 'px)';
  }

  function render() {
    slides.forEach(function (s, i) { s.classList.toggle('is-active', i === active); });
    thumbs.forEach(function (t, i) { t.classList.toggle('is-active', i === active); });
    moveHighlight();
  }

  wrapper.addEventListener('click', function (e) {
    var dirBtn = e.target.closest('[data-abb-dir]');
    var thumb  = e.target.closest('[data-abb-thumb]');
    if (dirBtn) {
      active = (active + Number(dirBtn.getAttribute('data-abb-dir')) + count) % count;
    } else if (thumb) {
      active = Number(thumb.getAttribute('data-abb-thumb'));
    } else {
      return;
    }
    render();
  });

  /* Position highlight on load (no transition for initial placement) */
  highlight.style.transition = 'none';
  moveHighlight();
  highlight.offsetHeight;
  highlight.style.transition = '';
  window.addEventListener('resize', moveHighlight);
})();
</script>
