<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citation Network Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafbfc; transition: background .3s; }
  canvas { display: block; width: 100%; height: 100%; }

  /* Legend */
  .legend {
    position: fixed; top: 12px; right: 12px;
    background: #fff; border-radius: 10px; padding: 14px 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1); z-index: 999;
    font-size: 13px; line-height: 1.6; transition: background .3s, color .3s;
  }
  .legend h4 { margin-bottom: 6px; color: #2d3748; font-size: 14px; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

  /* Tooltip */
  .tooltip {
    position: absolute; pointer-events: none; opacity: 0;
    background: #fff; border-radius: 8px; padding: 10px 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,.15); font-size: 12px;
    max-width: 300px; z-index: 1000; transition: opacity .15s, background .3s;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .tt-type { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: #718096; }
  .tooltip .tt-label { font-weight: 600; color: #2d3748; margin-top: 2px; word-wrap: break-word; }
  .tooltip .tt-detail { color: #4a5568; margin-top: 3px; }

  /* Controls */
  .controls {
    position: fixed; top: 12px; left: 12px;
    background: #fff; border-radius: 10px; padding: 12px 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1); z-index: 999;
    font-size: 13px; display: flex; flex-direction: column; gap: 8px;
    transition: background .3s, color .3s;
  }
  .controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #2d3748; }
  .controls input[type=checkbox] { accent-color: #667eea; }

  /* Dark mode overrides (GitHub-dark palette) */
  html.dark body, html.dark { background: #0d1117; }
  html.dark .legend { background: #161b22; border: 1px solid #30363d; box-shadow: 0 2px 12px rgba(0,0,0,.5); }
  html.dark .legend h4 { color: #e6edf3; }
  html.dark .legend-item { color: #c9d1d9; }
  html.dark .tooltip { background: #161b22; border: 1px solid #30363d; box-shadow: 0 4px 14px rgba(0,0,0,.6); }
  html.dark .tooltip .tt-type { color: #8b949e; }
  html.dark .tooltip .tt-label { color: #e6edf3; }
  html.dark .tooltip .tt-detail { color: #8b949e; }
  html.dark .controls { background: #161b22; border: 1px solid #30363d; box-shadow: 0 2px 12px rgba(0,0,0,.5); }
  html.dark .controls strong { color: #e6edf3 !important; }
  html.dark .controls label { color: #c9d1d9; }

  /* Error / empty state overlay */
  .msg-overlay {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #718096; font-size: 15px; z-index: 10; text-align: center;
  }
</style>
<script>
  /* Early theme detection – must run before body renders */
  (function () {
    var stored;
    try { stored = localStorage.getItem('site-theme'); } catch (e) {}
    var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>
</head>
<body>

<div class="controls" id="controls">
  <strong style="color:#2d3748">Filter Node Types</strong>
  <label><input type="checkbox" data-type="my_paper" checked> My Papers</label>
  <label><input type="checkbox" data-type="citing_paper" checked> Citing Papers</label>
  <label><input type="checkbox" data-type="author" checked> Authors</label>
  <label><input type="checkbox" data-type="institution" checked> Institutions</label>
  <label><input type="checkbox" data-type="country" checked> Countries</label>
</div>

<div class="legend">
  <h4>Citation Network</h4>
  <div class="legend-item"><span class="legend-dot" style="background:#667eea"></span> My Papers</div>
  <div class="legend-item"><span class="legend-dot" style="background:#f6ad55"></span> Citing Papers</div>
  <div class="legend-item"><span class="legend-dot" style="background:#68d391"></span> Authors</div>
  <div class="legend-item"><span class="legend-dot" style="background:#fc8181"></span> Institutions</div>
  <div class="legend-item"><span class="legend-dot" style="background:#b794f4"></span> Countries</div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-type"></div>
  <div class="tt-label"></div>
  <div class="tt-detail"></div>
</div>

<canvas id="graph"></canvas>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function () {
  'use strict';

  /* ---- theme helpers ---- */
  var dark = document.documentElement.classList.contains('dark');

  function linkColor()   { return dark ? '#30363d' : '#cbd5e0'; }
  function strokeColor() { return dark ? '#21262d' : '#ffffff'; }
  function hoverStroke()  { return dark ? '#e6edf3' : '#2d3748'; }

  function applyTheme(isDark) {
    dark = isDark;
    if (dark) document.documentElement.classList.add('dark');
    else      document.documentElement.classList.remove('dark');
    scheduleRedraw();
  }

  window.addEventListener('message', function (e) {
    if (e.data && typeof e.data.theme === 'string') applyTheme(e.data.theme === 'dark');
  });
  window.addEventListener('storage', function (e) {
    if (e.key === 'site-theme') applyTheme(e.newValue === 'dark');
  });

  /* ---- colour & sizing map ---- */
  var TYPE_CONFIG = {
    my_paper:     { color: '#667eea', radius: 14 },
    citing_paper: { color: '#f6ad55', radius: 6  },
    author:       { color: '#68d391', radius: 5  },
    institution:  { color: '#fc8181', radius: 9  },
    country:      { color: '#b794f4', radius: 12 }
  };
  var DEFAULT_CFG = { color: '#a0aec0', radius: 5 };
  function cfg(type) { return TYPE_CONFIG[type] || DEFAULT_CFG; }

  /* ---- HiDPI canvas setup ---- */
  var canvas = document.getElementById('graph');
  var ctx    = canvas.getContext('2d');
  var dpr    = window.devicePixelRatio || 1;
  var W, H;

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();

  /* ---- d3-zoom state ---- */
  var transform = d3.zoomIdentity;

  d3.select(canvas).call(
    d3.zoom()
      .scaleExtent([0.05, 10])
      .on('zoom', function (event) {
        transform = event.transform;
        scheduleRedraw();
      })
  );

  var tooltip = document.getElementById('tooltip');

  /* ---- load data ---- */
  var basePath = '';
  if (window.location.pathname.indexOf('/assets/') !== -1) {
    basePath = window.location.pathname.replace(/\/assets\/citation_graph\.html.*/, '');
  }

  d3.json(basePath + '/assets/citation_graph.json').then(function (raw) {
    if (!raw || !raw.nodes || raw.nodes.length === 0) {
      showMessage('No citation graph data yet. Run: scholarmap');
      return;
    }
    boot(raw);
  }).catch(function () {
    showMessage('citation_graph.json not found. Run: scholarmap');
  });

  function showMessage(msg) {
    var el = document.createElement('div');
    el.className = 'msg-overlay';
    el.textContent = msg;
    document.body.appendChild(el);
  }

  /* ---- main visualisation (Canvas-based) ---- */
  var redrawScheduled = false;
  function scheduleRedraw() {
    if (!redrawScheduled) {
      redrawScheduled = true;
      requestAnimationFrame(function () {
        redrawScheduled = false;
        draw();
      });
    }
  }

  /* Shared state set by boot() */
  var activeNodes = [];
  var activeLinks = [];
  var hoveredNode = null;

  function draw() {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.k, transform.k);

    var lc = linkColor();
    var sc = strokeColor();
    var hs = hoverStroke();

    /* Draw links */
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = lc;
    ctx.lineWidth   = 1 / transform.k;   /* keep visual width constant */
    ctx.beginPath();
    for (var i = 0, len = activeLinks.length; i < len; i++) {
      var l = activeLinks[i];
      if (l.source.x == null || l.target.x == null) continue;
      ctx.moveTo(l.source.x, l.source.y);
      ctx.lineTo(l.target.x, l.target.y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* Draw nodes */
    var strokeW = 1.5 / transform.k;
    for (var j = 0, nlen = activeNodes.length; j < nlen; j++) {
      var n  = activeNodes[j];
      if (n.x == null) continue;
      var c  = cfg(n.type);
      var r  = c.radius;
      var isHovered = (n === hoveredNode);

      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = c.color;
      ctx.fill();
      ctx.lineWidth   = isHovered ? (3 / transform.k) : strokeW;
      ctx.strokeStyle = isHovered ? hs : sc;
      ctx.stroke();
    }

    ctx.restore();
  }

  function boot(raw) {
    var allNodes = raw.nodes;
    var allLinks = raw.links.map(function (l) {
      return {
        source: (typeof l.source === 'object' ? l.source.id : l.source),
        target: (typeof l.target === 'object' ? l.target.id : l.target),
        type: l.type
      };
    });

    var visibleTypes = new Set(['my_paper', 'citing_paper', 'author', 'institution', 'country']);

    /* ---- simulation ---- */
    var simulation = d3.forceSimulation()
      .force('link',      d3.forceLink().id(function (d) { return d.id; }).distance(60))
      .force('charge',    d3.forceManyBody().strength(-80))
      .force('center',    d3.forceCenter(W / 2, H / 2))
      .force('x',         d3.forceX(W / 2).strength(0.03))
      .force('y',         d3.forceY(H / 2).strength(0.03))
      .force('collision', d3.forceCollide().radius(function (d) { return cfg(d.type).radius + 2; }));

    simulation.on('tick', scheduleRedraw);

    function rebuildGraph() {
      activeNodes = allNodes.filter(function (n) { return visibleTypes.has(n.type); });
      var visibleIds = new Set(activeNodes.map(function (n) { return n.id; }));

      /* Re-normalise links to string IDs (d3-force mutates source/target to objects) */
      var normalised = allLinks.map(function (l) {
        return {
          source: (typeof l.source === 'object' ? l.source.id : l.source),
          target: (typeof l.target === 'object' ? l.target.id : l.target),
          type: l.type
        };
      });
      activeLinks = normalised.filter(function (l) {
        return visibleIds.has(l.source) && visibleIds.has(l.target);
      });

      simulation.nodes(activeNodes);
      simulation.force('link').links(activeLinks);
      simulation.alpha(0.6).restart();
    }

    rebuildGraph();

    /* ---- hit-test: find node under (simX, simY) ---- */
    function findNode(simX, simY) {
      /* Iterate in reverse so topmost (last-drawn) nodes are found first */
      for (var i = activeNodes.length - 1; i >= 0; i--) {
        var n = activeNodes[i];
        if (n.x == null) continue;
        var dx = simX - n.x;
        var dy = simY - n.y;
        var r  = cfg(n.type).radius + 2;  /* small hit margin */
        if (dx * dx + dy * dy <= r * r) return n;
      }
      return null;
    }

    /* Convert page coords to simulation (world) coords */
    function toSim(pageX, pageY) {
      var rect = canvas.getBoundingClientRect();
      var cx = pageX - rect.left;
      var cy = pageY - rect.top;
      return [
        (cx - transform.x) / transform.k,
        (cy - transform.y) / transform.k
      ];
    }

    /* ---- Tooltip ---- */
    var TYPE_LABELS = { my_paper: 'My Paper', citing_paper: 'Citing Paper', author: 'Author', institution: 'Institution', country: 'Country' };

    function showTooltip(node, pageX, pageY) {
      tooltip.querySelector('.tt-type').textContent  = TYPE_LABELS[node.type] || node.type;
      tooltip.querySelector('.tt-label').textContent = node.label || node.id;

      var detail = '';
      if (node.year)    detail += 'Year: ' + node.year;
      if (node.city)    detail += (detail ? ' · ' : '') + node.city;
      if (node.country && node.type !== 'country') detail += (detail ? ', ' : '') + node.country;
      tooltip.querySelector('.tt-detail').textContent = detail;

      tooltip.classList.add('visible');
      tooltip.style.left = (pageX + 14) + 'px';
      tooltip.style.top  = (pageY - 10) + 'px';
    }

    function hideTooltip() {
      tooltip.classList.remove('visible');
    }

    /* ---- Pointer interaction (hover + drag in one handler) ---- */
    var dragNode = null;  /* node currently being dragged */

    canvas.addEventListener('mousemove', function (e) {
      if (dragNode) {
        /* Continue dragging */
        var sim = toSim(e.clientX, e.clientY);
        dragNode.fx = sim[0];
        dragNode.fy = sim[1];
        simulation.alpha(0.3).restart();
        showTooltip(dragNode, e.clientX, e.clientY);
        return;
      }

      var sim = toSim(e.clientX, e.clientY);
      var node = findNode(sim[0], sim[1]);
      if (node !== hoveredNode) {
        hoveredNode = node;
        canvas.style.cursor = node ? 'pointer' : 'default';
        scheduleRedraw();
      }
      if (node) {
        showTooltip(node, e.clientX, e.clientY);
      } else {
        hideTooltip();
      }
    });

    canvas.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;  /* left button only */
      var sim = toSim(e.clientX, e.clientY);
      var node = findNode(sim[0], sim[1]);
      if (node) {
        dragNode = node;
        node.fx = node.x;
        node.fy = node.y;
        simulation.alphaTarget(0.3).restart();
        e.stopPropagation();  /* prevent d3.zoom from capturing */
      }
    });

    window.addEventListener('mouseup', function () {
      if (dragNode) {
        dragNode.fx = null;
        dragNode.fy = null;
        dragNode = null;
        simulation.alphaTarget(0);
      }
    });

    canvas.addEventListener('mouseleave', function () {
      if (!dragNode) {
        hoveredNode = null;
        hideTooltip();
        scheduleRedraw();
      }
    });

    /* ---- Filter checkboxes ---- */
    document.querySelectorAll('#controls input[type=checkbox]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var type = this.getAttribute('data-type');
        if (this.checked) visibleTypes.add(type); else visibleTypes.delete(type);
        rebuildGraph();
      });
    });

    /* ---- Resize ---- */
    window.addEventListener('resize', function () {
      resizeCanvas();
      simulation.force('center', d3.forceCenter(W / 2, H / 2));
      simulation.force('x', d3.forceX(W / 2).strength(0.03));
      simulation.force('y', d3.forceY(H / 2).strength(0.03));
      scheduleRedraw();
    });
  }
})();
</script>
</body>
</html>
