{% include base_path %}
<script src="{{ base_path }}/assets/js/main.min.js" defer></script>

<script>
/*
 * Greedy-nav fix: main.min.js (deferred) bundles old greedy-nav code that
 * moves li elements from .visible-links into .hidden-links at ready-time
 * and on resize.  The bundled updateNav() is recursive and bound to
 * $(window).resize inside a closure we cannot patch.
 *
 * Strategy: after greedy-nav finishes its initial collapse, restore all
 * links, then REPLACE the .visible-links, .hidden-links and button DOM
 * nodes with fresh clones.  The closure still holds jQuery references to
 * the OLD (now detached) nodes, so every future updateNav() call
 * harmlessly manipulates phantom elements — no infinite loop, no jank.
 *
 * IMPORTANT: only block comments here — compress_html strips newlines,
 * which would turn single-line comments into one giant comment.
 */
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    var nav = document.getElementById('site-nav');
    if (!nav) { return; }

    var oldVlinks = nav.querySelector('.visible-links');
    var oldHlinks = nav.querySelector('.hidden-links');
    var oldBtn    = document.getElementById('greedy-nav-btn');
    if (!oldVlinks) { return; }

    /* Move any hidden children back to visible */
    if (oldHlinks) {
      while (oldHlinks.firstChild) {
        oldVlinks.appendChild(oldHlinks.firstChild);
      }
    }

    /*
     * Deep-clone .visible-links and swap it in.
     * cloneNode does NOT copy event listeners or jQuery data,
     * so greedy-nav's closure keeps referencing the detached original.
     */
    var newVlinks = oldVlinks.cloneNode(true);
    oldVlinks.parentNode.replaceChild(newVlinks, oldVlinks);

    /* Replace .hidden-links with an empty shell */
    if (oldHlinks) {
      var newHlinks = oldHlinks.cloneNode(false);
      newHlinks.className = 'hidden-links hidden';
      newHlinks.style.display = 'none';
      oldHlinks.parentNode.replaceChild(newHlinks, oldHlinks);
    }

    /* Replace the overflow button so its click handler is also severed */
    if (oldBtn) {
      var newBtn = oldBtn.cloneNode(true);
      newBtn.className = 'hidden';
      newBtn.style.cssText = 'display:none;visibility:hidden;position:absolute';
      oldBtn.parentNode.replaceChild(newBtn, oldBtn);
    }
  }, 0);
});
</script>
