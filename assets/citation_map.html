<script>
/* ---- Dark / Light theme support ---- */
(function () {
  var darkCSS = document.createElement('style');
  darkCSS.textContent =
    /* Invert tile pane for a soft, warm dark basemap */
    '.dark-theme .leaflet-tile-pane {' +
    '  filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9);' +
    '}' +
    /* Popups – GitHub-dark inspired palette */
    '.dark-theme .leaflet-popup-content-wrapper,' +
    '.dark-theme .leaflet-popup-tip { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; }' +
    '.dark-theme .leaflet-popup-content h4 { color: #e6edf3 !important; }' +
    '.dark-theme .leaflet-popup-content div { color: #8b949e !important; }' +
    '.dark-theme .leaflet-popup-close-button { color: #8b949e !important; }' +
    '.dark-theme .leaflet-popup-close-button:hover { color: #e6edf3 !important; }' +
    /* Zoom controls */
    '.dark-theme .leaflet-control-zoom a { background: #21262d; color: #c9d1d9; border-color: #30363d; }' +
    '.dark-theme .leaflet-control-zoom a:hover { background: #30363d; color: #e6edf3; }' +
    /* Attribution */
    '.dark-theme .leaflet-control-attribution { background: rgba(13,17,23,.85); color: #8b949e; }' +
    '.dark-theme .leaflet-control-attribution a { color: #58a6ff; }' +
    /* Marker clusters – soft blue glow */
    '.dark-theme .marker-cluster { background-color: rgba(88,166,255,.3); }' +
    '.dark-theme .marker-cluster div { background-color: rgba(88,166,255,.6); color: #e6edf3; }';
  document.head.appendChild(darkCSS);

  function applyTheme(dark) {
    if (dark) {
      document.body.classList.add('dark-theme');
      document.body.style.background = '#0d1117';
    } else {
      document.body.classList.remove('dark-theme');
      document.body.style.background = '';
    }
  }

  /* Detect initial theme from parent's localStorage */
  var stored;
  try { stored = localStorage.getItem('site-theme'); } catch (e) {}
  var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) applyTheme(true);

  /* Listen for theme changes from parent frame */
  window.addEventListener('message', function (e) {
    if (e.data && typeof e.data.theme === 'string') applyTheme(e.data.theme === 'dark');
  });

  /* Cross-tab sync */
  window.addEventListener('storage', function (e) {
    if (e.key === 'site-theme') applyTheme(e.newValue === 'dark');
  });
})();
</script>
